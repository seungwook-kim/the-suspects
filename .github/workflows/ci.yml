name: CI

# 서버 테스트(가짜 LLM, 키 없음)와 화면 검사·테스트. 진짜 모델·그림 연결은 쓰지 않는다 → 사용량·요금 없음.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12  # 프로젝트 기준 파이썬 (AGENTS.md)
      - run: uv run --frozen --python 3.12 pytest -q
        env:
          # 키가 없으면 모든 역할이 가짜 LLM, 그림은 꺼짐 (AGENTS.md)
          OPENROUTER_API_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
