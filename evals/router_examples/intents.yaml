# 시맨틱 라우터 의도별 예시 문장 (PRD §7.1, §17.6)
# 의도마다 20~50개로 시작하고, LLM 라우터로 넘어간 실제 문장을 검토해 늘린다.
# hard: 난이도 "어려움" 판정용 예시 (주요 NPC에게 온 어려운 질문 → npc_hard 모델)

