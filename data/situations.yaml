# data/situations.yaml: 탐정 평가·사건 생성에 쓰는 "상황" 목록 (2026-10-26).
# 상황 하나 = 무대(장소) + 사건 씨앗 한 줄 + 등장 후보 직업 8~12명.
# 사건 생성기는 여기서 이 중 5~10명을 골라 쓴다(plan.draw가 인원을 정함). 실존 인물·기업 없음.
# 안전 규칙: 사건은 절도·사기·사보타주·분실·정보 유출·원인불명 고장 같은 것만. 미성년자 위험·성적 내용·독극물 없음.
#
# 역할 줄: role(직업 이름) / group(var/portrait_library 직업군) 또는 needs_new_group(맞는 상자가 없을 때 새 상자 이름)
#          gender M|F|any / age [최소, 최대] / hook(다른 사람과의 관계·동기 한 줄)
# group: security cleaning medical culinary delivery student field office general
# existing_case: 이미 만들어 둔 사건 id가 있으면 적는다(사건 수 세기·돌려 보기에 쓴다).

proposed_groups:   # 아직 사진 상자가 없는 직업군 제안 (직업군 이름 -> 한글 이름)
  education: 교직·강사
  public: 공무·치안·법조
  arts: 예술·공연·언론
  agri: 농어업
  service: 판매·접객

